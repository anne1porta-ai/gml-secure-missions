# Profil de production : activer avec SPRING_PROFILES_ACTIVE=prod.
# Les secrets et la connexion PostgreSQL doivent être injectés par l'environnement.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

app.jwt.secret=${JWT_SECRET}
app.encryption.secret-key=${ENCRYPTION_KEY}

app.cookie.secure=${COOKIE_SECURE:true}
app.demo.seed-enabled=${DEMO_SEED_ENABLED:false}
spring.jpa.open-in-view=false

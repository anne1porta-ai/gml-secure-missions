spring.application.name=gml-shield-backend
server.port=${SERVER_PORT:8080}
# Le reverse proxy réécrit X-Forwarded-For ; Tomcat ne tient compte que des proxys internes de confiance.
server.forward-headers-strategy=native
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}

# --- PostgreSQL : moteur relationnel unique du projet ---
# En developpement local, PostgreSQL doit etre disponible sur localhost:5432.
# En Docker/prod, DB_URL est injecte par l'environnement.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gmlshield}
spring.datasource.username=${DB_USER:gml}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- JWT d'accès court + refresh token rotatif ---
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# false uniquement en HTTP local ; true derrière HTTPS.
app.cookie.secure=${COOKIE_SECURE:false}

# Protection simple contre les tentatives répétées de connexion.
app.auth.max-failed-attempts=${AUTH_MAX_FAILED_ATTEMPTS:5}
app.auth.lock-duration-seconds=${AUTH_LOCK_DURATION_SECONDS:300}
app.auth.max-tracked-identities=${AUTH_MAX_TRACKED_IDENTITIES:10000}

# Limitation complémentaire par IP sur POST /api/auth/login.
# Elle réduit notamment le password spraying avec de nombreux emails.
app.auth.ip-rate-limit.max-requests=${AUTH_IP_RATE_LIMIT_MAX_REQUESTS:20}
app.auth.ip-rate-limit.window-seconds=${AUTH_IP_RATE_LIMIT_WINDOW_SECONDS:60}
app.auth.ip-rate-limit.max-clients=${AUTH_IP_RATE_LIMIT_MAX_CLIENTS:10000}

# Comptes de démonstration Dispatcher/Driver : développement local uniquement, désactivés par défaut.
app.demo.seed-enabled=${DEMO_SEED_ENABLED:false}

# Compte administrateur initial : créé au démarrage seulement si aucun administrateur n'existe.
app.bootstrap.admin-email=${ADMIN_EMAIL:}
app.bootstrap.admin-password=${ADMIN_PASSWORD:}

# --- Stockage des preuves de livraison ---
app.storage.documents-dir=${DOCUMENT_STORAGE_PATH:./storage/documents}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# --- Chiffrement AES-256-GCM ---
app.encryption.secret-key=${ENCRYPTION_KEY}

# --- Observabilité / documentation ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
springdoc.swagger-ui.path=/swagger-ui.html

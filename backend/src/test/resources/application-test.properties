# Le DataSource de test est fourni dynamiquement par Testcontainers via @ServiceConnection.
# Aucun moteur embarque : les tests d'integration utilisent PostgreSQL 16.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.jwt.secret=test-jwt-secret-with-more-than-thirty-two-bytes-2026
app.jwt.expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000
app.encryption.secret-key=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
app.cookie.secure=false
app.demo.seed-enabled=false
app.frontend-origin=http://localhost:5173
app.storage.documents-dir=./target/test-storage/documents

# Valeur large pour ne pas perturber les tests d'integration existants.
app.auth.ip-rate-limit.max-requests=100
app.auth.ip-rate-limit.window-seconds=60
app.auth.ip-rate-limit.max-clients=100
app.auth.max-tracked-identities=100

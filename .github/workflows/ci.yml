name: CI

on:
  push:
    branches: [main]
  pull_request:

# Garder la derniere validation d'une PR, sans interrompre celles de main.
# La CI sur main reste necessaire avant le deploiement OVH.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Check Google Java formatting
        working-directory: backend
        run: mvn -B -ntp spotless:check

      - name: Verify Docker for PostgreSQL Testcontainers
        run: docker info

      # Les seuils de couverture sont verifies par JaCoCo (jacoco:check, pom.xml).
      - name: Tests, JaCoCo report and coverage thresholds (PostgreSQL Testcontainers)
        working-directory: backend
        run: mvn -B -ntp verify

      - name: SpotBugs static analysis
        working-directory: backend
        run: mvn -B -ntp spotbugs:check

  backend-dependencies:
    name: Backend dependency security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Restore Dependency-Check data cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/dependency-check-data
          key: dependency-check-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            dependency-check-${{ runner.os }}-

      - name: OWASP Dependency-Check
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail

          DATA_DIR="${RUNNER_TEMP}/dependency-check-data"
          mkdir -p "$DATA_DIR"

          # Ce job analyse uniquement les dépendances : les tests et la couverture
          # sont vérifiés par le job "Backend quality".
          mvn -B -ntp -Psecurity-scan \
            -DdataDirectory="$DATA_DIR" \
            -DnvdDatafeedUrl="https://dependency-check.github.io/DependencyCheck_Builder/nvd_cache/nvdcve-{0}.json.gz" \
            dependency-check:check

      - name: Save Dependency-Check data cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/dependency-check-data
          key: dependency-check-${{ runner.os }}-${{ github.run_id }}

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Une dépendance de production avec une vulnérabilité High ou Critical bloque la PR.
      - name: npm audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Prettier check
        working-directory: frontend
        run: npm run format:check

      - name: Frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    # Sur une pull request, gitleaks-action lit la liste des commits de la PR :
    # il lui faut ce droit en lecture, en plus de la lecture du code.
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A GITLEAKS_LICENSE secret is only required if this repository is moved
          # under a GitHub Organization using the licensed action mode.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  functional-e2e:
    name: Parcours fonctionnels Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v6

      - name: Installer Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Préparer une base de test indépendante
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          admin_password="$(openssl rand -hex 18)"

          {
            echo "DB_PASSWORD=$(openssl rand -hex 24)"
            echo "JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')"
            echo "ENCRYPTION_KEY=$(openssl rand -base64 32 | tr -d '\n')"
            echo "ADMIN_EMAIL=admin.e2e@example.test"
            echo "ADMIN_PASSWORD=$admin_password"
            echo "DEMO_SEED_ENABLED=true"
            echo "COOKIE_SECURE=false"
            echo "COMPOSE_PROJECT_NAME=gmlshield-e2e"
            echo "FRONTEND_ORIGIN=http://127.0.0.1:8088"
          } > .env

          echo "E2E_ADMIN_PASSWORD=$admin_password" >> "$GITHUB_ENV"

      - name: Démarrer l'application et PostgreSQL de test
        run: docker compose -p gmlshield-e2e -f compose.yaml -f compose.test.yaml up -d --build --wait --wait-timeout 300

      - name: Installer les outils de test
        working-directory: e2e
        run: npm install --no-audit --no-fund

      - name: Installer Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Vérifier les parcours utilisateur
        working-directory: e2e
        run: npm test

      - name: Vérifier le parcours API local
        shell: pwsh
        run: ./scripts/check-api.ps1 -BaseUrl "http://127.0.0.1:8080"

      - name: Vérifier le diagnostic et la sauvegarde sur l'application de test
        shell: bash
        run: |
          set -euo pipefail

          bash scripts/operations/check-production.sh --local-only
          bash scripts/operations/backup-production.sh --output-dir "$RUNNER_TEMP/gml-backups-test"

          cd "$RUNNER_TEMP/gml-backups-test"
          sha256sum -c *.sha256

          archive="$(find . -maxdepth 1 -name 'GMLSHIELD-*.tar.gz' -print -quit)"
          test -n "$archive"
          tar -tzf "$archive" | grep -Fx 'postgres.dump'
          tar -tzf "$archive" | grep -Fx 'documents.tar.gz'

      - name: Afficher les journaux en cas d'erreur
        if: failure()
        run: docker compose -p gmlshield-e2e -f compose.yaml -f compose.test.yaml logs --tail=100

      - name: Supprimer les données de test
        if: always()
        shell: bash
        run: |
          docker compose -p gmlshield-e2e -f compose.yaml -f compose.test.yaml down -v --remove-orphans || true
          rm -f .env

  production-tools:
    name: Production tools syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Vérifier la syntaxe du lanceur de sécurité
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("scripts/run-security-tests.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            throw ($errors | ForEach-Object { $_.Message } | Out-String)
          }
          ./scripts/run-security-tests.ps1 -Help

      - name: Vérifier les scripts de validation locale
        shell: pwsh
        run: |
          foreach ($path in @("scripts/run-all-tests.ps1", "scripts/report-local-tests.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -ne 0) {
              throw "$path : $($errors | ForEach-Object { $_.Message } | Out-String)"
            }
          }

      - name: Vérifier la génération du rapport de tests
        shell: pwsh
        run: |
          $temp = Join-Path $env:RUNNER_TEMP "report-fixture"
          $backend = Join-Path $temp "backend"
          $reports = Join-Path $backend "target/surefire-reports"
          $artifacts = Join-Path $temp "artifacts"
          New-Item -ItemType Directory -Force -Path $reports, $artifacts | Out-Null
          @'
          <testsuite name="Demo" tests="2">
            <testcase classname="Demo" name="passes"/>
            <testcase classname="Demo" name="skips"><skipped/></testcase>
          </testsuite>
          '@ | Set-Content -Path (Join-Path $reports "TEST-Demo.xml")
          @'
          > gml-shield-frontend test
          > node --test
          TAP version 13
          ok 1 - frontend smoke
          # tests 1
          # pass 1
          # fail 0
          '@ | Set-Content -Path (Join-Path $artifacts "frontend-quality.log")
          @'
          [1/2] Health
          [2/2] Login
          VERIFICATION API LOCALE OK
          '@ | Set-Content -Path (Join-Path $artifacts "api-tests.log")
          ./scripts/report-local-tests.ps1 -BackendDir $backend -ArtifactsDir $artifacts -StartedAt (Get-Date).AddMinutes(-2) -ApiStatus OK -CleanupStatus OK -RunStatus OK
          $tests = @(Import-Csv -Path (Join-Path $artifacts "resultats-tests.csv") -Delimiter ';')
          if ($tests.Count -ne 5) { throw "Bilan attendu : 5 cas, obtenu : $($tests.Count)" }
          if (@($tests | Where-Object { $_.Resultat -eq 'IGNORE' }).Count -ne 1) { throw "Le test ignore n'est pas comptabilise." }
          if (-not (Test-Path (Join-Path $artifacts "resultats-tests.md"))) { throw "Rapport Markdown manquant." }

      - name: Vérifier les scripts de production
        shell: bash
        run: |
          bash -n scripts/operations/check-production.sh
          bash -n scripts/operations/backup-production.sh
